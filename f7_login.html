<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="Description" content="Create login form">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            
        }
        input{
            width:200px;
            height:30px;
            margin:10px;
            
            justify-content:left;
            text-align:left;
           outline:none;

        }
        label {
                color: white;
                 font-family: cursive;
            }

        </style>
</head>
<body style="background-color:rgb(6, 6, 93);">
   <form style="background-color:rgb(23, 22, 22) ;padding:20px; border-radius:10px; border:1px solid white;  margin:100px; width:270px; height:310px;">
     
       <center style="color:white; font-family: cursive;"><h2>Login</h2></center>
        <label>Email:</label>
       <input type="email" name="email" placeholder=" Enter your email" style=" border-bottom: 2px solid rgb(122, 121, 121); border-right:2px solid black; background-color:rgb(30, 30, 30); color:white;" ><br> 
        <label>Password:</label>
       <input type="password" name="password" placeholder=" Enter your password" style=" border-bottom: 2px solid rgb(122, 121, 121);border-right:2px solid black; background-color:rgb(30, 30, 30); color:white;" ><br><br>
       <input type="submit" name="submit" value="Submit" style="background-color:rgb(6, 6, 93); color:white; font-family: cursive; font-size:15px; cursor:pointer; border-radius:10px; text-align:center;"><br><br>
          
    </form>
</body>
