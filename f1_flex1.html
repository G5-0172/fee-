<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Prachi">
    <title>Flex Box</title>
    <link rel="stylesheet" href="">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courgette&family=Dancing+Script:wght@400..700&display=swap');

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100dvh;
            font-family: "Courgette";
            font-size: 16px;
            background-color: white;
            color: white;
        }
        section{
            padding: 10px;
        }
        .box{
            background-color: darkred;
        }
    </style>
</head>
<body>
    <section class="box" style="height: 10vh">Header \ Navbar</section>
    <section
        class="box"
        style="height:80vh;background-color: white;">
    </section>
    <section
        class="box"
        style="position: absolute; bottom: 0; left: 0; height: 10vh; width: 100%";
    >
    Footer
    </section>

    </body>
</body>
</html>
