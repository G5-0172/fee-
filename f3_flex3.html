<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignment 5</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:550px;
    height:400px;
    border:3px solid white;
    display:flex;
    flex-direction:column;
    justify-content:space-around;
    align-items:center;
    padding:20px;
}

.box{
    width:120px;
    height:80px;
    background:blue;
    border-radius:8px;
}

.middle{
    display:flex;
    gap:30px;
}
@media (max-width:600px) {
    .container {
        width: 90%;
        height: auto;
        padding: 10px;
    }

    .box {
        width: 100px;
        height: 60px;
    }

    .middle {
        gap: 15px;
    }
}
</style>

</head>
<body>

<div class="container">

    <div class="box"></div>

    <div class="middle">
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <div class="box"></div>

</div>

</body>
</html>
