<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<head>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    padding:20px;
    background:url("https://images.unsplash.com/photo-1485470733090-0aae1788d5af?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8NGslMjB3YWxscGFwZXJzfGVufDB8fDB8fHww") center/cover no-repeat;
    font-family:Arial;
}

.container{
    height:100%;
    display:flex;
    flex-direction:column;
}

.box{
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(1px);
    border:1px solid rgb(22, 22, 22);
    border-radius:5px;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    color: black;
}

.header{
    width:70%;
    height:100px;
    margin:0 auto;
}

.space{
    flex:1;
}

.footer{
    display:flex;
    gap:15px;
}

.footer .box{
    flex:1;
    height:150px;
}

</style>
</head>
<body>
<div class="container">

    <div class="box header">
        1
    </div>

    <div class="space"></div>

    <div class="footer">
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
    </div>
</div>
</body>
</html>
